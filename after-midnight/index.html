<!DOCTYPE html>
<html>
<head>
  <title>PLAY</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #1c1c1c;
      color: #ff99dd;
      font-family: "Courier New", monospace;
      text-align: center;
      margin-top: 12vh;
    }

    h1 {
      letter-spacing: 8px;
      font-size: 42px;
      margin-bottom: 50px;
      text-shadow: 0 0 12px #ff66cc;
    }

    .btn {
      display: block;
      width: 280px;
      margin: 18px auto;
      padding: 16px;
      background: #111;
      border: 2px solid #ff66cc;
      color: #ff99dd;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 2px;
    }

    .btn:hover {
      background: #ff66cc;
      color: #111;
      box-shadow: 0 0 18px #ff66cc;
    }

    .links {
      margin-top: 70px;
      font-size: 12px;
    }

    .links a {
      color: #ff99dd;
      text-decoration: none;
      margin: 0 10px;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<h1>PLAY ME</h1>

<button class="btn" onclick="playVideo()">VIDEO</button>
<button class="btn" onclick="openWeird()">RANDOM WEB</button>

<div class="links">
  <a href="https://soundcloud.com/filthyfranktv123" target="_blank">SoundCloud</a>
  |
  <a href="https://instagram.com/opd.3005" target="_blank">Instagram</a>
  |
  <a href="https://youtube.com/@allgoodtoday1985" target="_blank">YouTube</a>
</div>

<script>
function playVideo() {
  window.location.href = "https://www.youtube.com/watch?v=Yj36pNuib_8";
}

function openWeird() {
  window.location.href = "https://theuselessweb.com/";
}
</script>

</body>
</html>
