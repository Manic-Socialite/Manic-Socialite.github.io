<!DOCTYPE html>
<html>
<head>
  <title>PLAY</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: "Courier New", monospace;
      text-align: center;
      margin-top: 12vh;
    }

    h1 {
      letter-spacing: 8px;
      font-size: 42px;
      margin-bottom: 50px;
    }

    .btn {
      display: block;
      width: 280px;
      margin: 16px auto;
      padding: 16px;
      background: transparent;
      border: 2px solid #fff;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 2px;
    }

    .btn:hover {
      background: #fff;
      color: #000;
    }

    .rainbow {
      border: 2px solid transparent;
      background: linear-gradient(#000, #000) padding-box,
                  linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, violet, red) border-box;
      animation: hue 4s linear infinite;
    }

    @keyframes hue {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .links {
      margin-top: 60px;
      font-size: 12px;
    }

    .links a {
      color: #fff;
      text-decoration: none;
      margin: 0 10px;
    }

    /* VIDEO OVERLAY */
    #videoOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    #videoOverlay video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #closeBtn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 40px;
      color: #fff;
      cursor: pointer;
      z-index: 10000;
    }
  </style>
</head>

<body>

<h1>`^%*$#?</h1>

<!-- VIDEO BUTTONS -->
<button class="btn" onclick="playVideo('Elusive.mp4')">
PLAY ME OUTLOUD
</button>

<button class="btn" onclick="playVideo('Deleuze1.mp4')">
PLAY ME OUTLOUD
</button>

<button class="btn" onclick="playVideo('Elusive2.mp4')">
PLAY ME OUTLOUD
</button>

<!-- RANDOM WEB -->
<button class="btn rainbow" onclick="openWeird()">
RANDOM WEB
</button>

<!-- LINKS -->
<div class="links">
  <a href="https://soundcloud.com/filthyfranktv123" target="_blank">SoundCloud</a>
  |
  <a href="https://instagram.com/opd.3005" target="_blank">Instagram</a>
  |
  <a href="https://www.youtube.com/@Rehtoric_fix" target="_blank">YouTube</a>
</div>

<!-- VIDEO PLAYER -->
<div id="videoOverlay">
  <div id="closeBtn" onclick="closeVideo()">✕</div>

  <video id="mainVideo" controls playsinline>
    <source id="videoSource" src="" type="video/mp4">
  </video>
</div>

<script>
function playVideo(file) {
  const overlay = document.getElementById("videoOverlay");
  const video = document.getElementById("mainVideo");
  const source = document.getElementById("videoSource");

  source.src = file;
  video.load();

  overlay.style.display = "flex";
  video.play();
}

function closeVideo() {
  const overlay = document.getElementById("videoOverlay");
  const video = document.getElementById("mainVideo");

  video.pause();
  video.currentTime = 0;
  overlay.style.display = "none";
}

function openWeird() {
  window.location.href = "https://theuselessweb.com/";
}
</script>

</body>
</html>
