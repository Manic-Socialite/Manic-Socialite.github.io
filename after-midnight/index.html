<!DOCTYPE html>
<html>
<head>
  <title>Watch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #1c1c1c;
      color: #00ff66;
      font-family: "Courier New", monospace;
      text-align: center;
      margin-top: 8vh;
    }

    h1 {
      letter-spacing: 6px;
      margin-bottom: 30px;
    }

    #videoContainer {
      display: none;
      width: 90%;
      max-width: 800px;
      margin: auto;
    }

    video {
      width: 100%;
      border: 3px solid #555;
      box-shadow: 0 0 20px #000;
      background: black;
    }

    .links {
      margin-top: 40px;
      font-size: 12px;
    }

    .links a {
      color: #00ff66;
      text-decoration: none;
      margin: 0 10px;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<h1>PLAY ME</h1>

<div id="videoContainer">
  <video id="video" autoplay controls>
    <source src="yourvideo.mp4" type="video/mp4">
    Your browser does not support video.
  </video>
</div>

<div class="links">
  <a href="https://soundcloud.com/filthyfranktv123" target="_blank">SoundCloud</a>
  |
  <a href="https://instagram.com/opd.3005" target="_blank">Instagram</a>
  |
  <a href="https://youtube.com/@allgoodtoday1985" target="_blank">YouTube</a>
</div>

<script>
window.onload = function () {
  document.getElementById("videoContainer").style.display = "block";

  const video = document.getElementById("video");

  video.play().catch(() => {
    video.muted = true;
    video.play();
  });
};
</script>

</body>
</html>
