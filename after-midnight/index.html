<!DOCTYPE html>
<html>
<head>
  <title>PLAY</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #1c1c1c;
      color: #a8f0ff;
      font-family: "Courier New", monospace;
      text-align: center;
      margin-top: 12vh;
    }

    h1 {
      letter-spacing: 8px;
      font-size: 42px;
      margin-bottom: 50px;
      text-shadow: 0 0 12px #66ffff;
    }

    /* MAIN BUTTON STYLE (transparent neon glass) */
    .btn {
      display: block;
      width: 280px;
      margin: 18px auto;
      padding: 16px;
      background: transparent;
      border: 2px solid #66ffff;
      color: #a8f0ff;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 2px;
    }

    .btn:hover {
      background: rgba(102, 255, 255, 0.15);
      box-shadow: 0 0 18px #66ffff;
    }

    /* RAINBOW BUTTON */
    .rainbow {
      border: 2px solid transparent;
      background: linear-gradient(#1c1c1c, #1c1c1c) padding-box,
                  linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, violet, red) border-box;
      color: #a8f0ff;
      animation: rainbowMove 5s linear infinite;
    }

    @keyframes rainbowMove {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    /* LINKS */
    .links {
      margin-top: 70px;
      font-size: 12px;
    }

    .links a {
      color: #a8f0ff;
      text-decoration: none;
      margin: 0 10px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    /* VIDEO OVERLAY */
    #videoOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    #videoOverlay video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #closeBtn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 40px;
      color: white;
      cursor: pointer;
      z-index: 10000;
    }
  </style>
</head>

<body>

<h1>PLAY ME</h1>

<button class="btn" onclick="playVideo()">
PLAY ME OUTLOUD! 🔊
</button>

<button class="btn rainbow" onclick="openWeird()">
RANDOM WEB
</button>

<div class="links">
  <a href="https://soundcloud.com/filthyfranktv123" target="_blank">SoundCloud</a>
  |
  <a href="https://instagram.com/opd.3005" target="_blank">Instagram</a>
  |
  <a href="https://www.youtube.com/@Rehtoric_fix" target="_blank">YouTube</a>
</div>

<!-- VIDEO OVERLAY -->
<div id="videoOverlay">
  <div id="closeBtn" onclick="closeVideo()">✕</div>

  <video id="mainVideo" controls playsinline>
    <source src="Elusive.mp4" type="video/mp4">
  </video>
</div>

<script>
function playVideo() {
  const overlay = document.getElementById("videoOverlay");
  const vid = document.getElementById("mainVideo");

  overlay.style.display = "flex";
  vid.play();
}

function closeVideo() {
  const overlay = document.getElementById("videoOverlay");
  const vid = document.getElementById("mainVideo");

  vid.pause();
  vid.currentTime = 0;
  overlay.style.display = "none";
}

function openWeird() {
  window.location.href = "https://theuselessweb.com/";
}
</script>

</body>
</html>
