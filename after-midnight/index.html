<!DOCTYPE html>
<html>
<head>
  <title>PLAY</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #1c1c1c;
      color: #ff66cc;
      font-family: "Courier New", monospace;
      text-align: center;
      margin-top: 10vh;
    }

    h1 {
      letter-spacing: 6px;
      margin-bottom: 40px;
    }

    .btn {
      padding: 14px 40px;
      background: #101010;
      border: 2px solid #ff66cc;
      color: #ff66cc;
      font-size: 18px;
      cursor: pointer;
      margin: 10px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #ff66cc;
      color: #101010;
    }

    #videoContainer {
      display: none;
      width: 90%;
      max-width: 800px;
      margin: 30px auto;
    }

    video {
      width: 100%;
      border: 3px solid #555;
      box-shadow: 0 0 20px #000;
      background: black;
    }

    .links {
      margin-top: 40px;
      font-size: 12px;
    }

    .links a {
      color: #ff66cc;
      text-decoration: none;
      margin: 0 10px;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<h1>PLAY ME</h1>

<button class="btn" onclick="playVideo()">VIDEO</button>
<button class="btn" onclick="openWeird()">RANDOM WEB</button>

<div id="videoContainer">
  <video id="video" controls autoplay muted>
    <source src="yourvideo.mp4" type="video/mp4">
  </video>
</div>

<div class="links">
  <a href="https://soundcloud.com/filthyfranktv123" target="_blank">SoundCloud</a>
  |
  <a href="https://instagram.com/opd.3005" target="_blank">Instagram</a>
  |
  <a href="https://youtube.com/@allgoodtoday1985" target="_blank">YouTube</a>
</div>

<script>
function playVideo() {
  document.getElementById("videoContainer").style.display = "block";
  const video = document.getElementById("video");
  video.play();
}

function openWeird() {
  window.location.href = "https://theuselessweb.com/";
}
</script>

</body>
</html>
