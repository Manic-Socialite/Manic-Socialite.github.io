<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
margin:0;
background:black;
font-family:Courier New;
color:white;
text-align:center;
padding-top:100px;
}

h1{
font-size:50px;
color:hotpink;
}

button{
display:block;
width:320px;
margin:20px auto;
padding:20px;
font-size:20px;
border:none;
cursor:pointer;
}

#play{
background:hotpink;
color:black;
animation:flash 1s infinite;
}

#random{
color:white;
background:linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, violet, red);
background-size:600%;
animation:rainbow 3s linear infinite;
}

@keyframes rainbow{
0%{background-position:0%;}
100%{background-position:100%;}
}

@keyframes flash{
50%{opacity:.5;}
}
</style>
</head>

<body>

<h1>PLAY ME</h1>

<button id="play" onclick="playVideo()">
PLAY ME OUTLOUD 🔊
</button>

<button id="random" onclick="openWeird()">
RANDOM WEB
</button>

<script>
function playVideo(){
window.location.href="https://youtube.com/watch?v=Yj36pNuib_8";
}

function openWeird(){
window.location.href="https://theuselessweb.com/";
}
</script>

</body>
</html>
